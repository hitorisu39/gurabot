name: gurabot

networks:
    gurabot_network:
        name: gurabot_network

services:
    gurabot:
        image: ${APP_IMAGE:?APP_IMAGE must be set}:${APP_IMAGE_TAG:?APP_IMAGE_TAG must be set}
        pull_policy: always
        container_name: ${APP_NAME:-gurabot}-app
        restart: unless-stopped
        env_file:
            - .env
        profiles: ["prod"]
        networks:
            - gurabot_network
        ports:
            - "9090:9090"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
            calculator:
                condition: service_started
        environment:
            APP_MODE: production
            CALCULATOR_HOST: calculator
            REDIS_HOST: redis
            DATABASE_HOST: postgres
            LOKI_HOST: http://loki:3100

    calculator:
        image: ${APP_IMAGE:?APP_IMAGE must be set}-calculator:${APP_IMAGE_TAG:?APP_IMAGE_TAG must be set}
        pull_policy: always
        container_name: ${APP_NAME:-gurabot}-calculator
        restart: unless-stopped
        profiles: ["prod"]
        networks:
            - gurabot_network
        environment:
            ASPNETCORE_URLS: http://+:5000

    postgres:
        image: postgres:17.6
        container_name: ${APP_NAME:-gurabot}-postgres
        restart: unless-stopped
        networks:
            - gurabot_network
        environment:
            POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
            POSTGRES_DB: ${DATABASE_NAME:-gurabot}
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U ${DATABASE_USERNAME:-postgres}
            interval: 5s
            timeout: 5s
            retries: 5
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        image: redis:7.2-alpine
        container_name: ${APP_NAME:-gurabot}-redis
        restart: unless-stopped
        networks:
            - gurabot_network
        volumes:
            - redis_data:/data
        command:
            - redis-server
            - --appendonly
            - "yes"

volumes:
    postgres_data:
    redis_data: