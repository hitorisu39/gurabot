<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>gurabot</title>
        <link rel="stylesheet" href="/styles/main.css" />
        <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    </head>
    <body>
        <main id="site-main">
            <div class="auth">
                <div class="header">
                    <img src="/assets/images/{{CONNECTION_IMAGE}}.png" class="auth_image" />
                </div>
                <hr />
                <div class="body">
                    <div class="checkmark">
                        <object data="/assets/images/{{CHECKMARK_IMAGE}}.svg" type="image/svg+xml">
                            <img src="/assets/images/{{CHECKMARK_IMAGE}}.png" />
                        </object>
                    </div>
                    <p class="title">{{TITLE}}</p>
                    <p class="description">{{DESCRIPTION}}</p>
                </div>
                <hr />
                <div class="footer">
                    <div class="app">{{FOOTER}}</div>
                </div>
            </div>
        </main>
    </body>
</html>
