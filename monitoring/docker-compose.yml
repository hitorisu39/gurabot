name: gurabot-monitoring

x-logging: &default-logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    prometheus:
        image: prom/prometheus:v3.13.2
        container_name: ${APP_NAME:-gurabot}-prometheus
        restart: unless-stopped
        logging: *default-logging

        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus

        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--storage.tsdb.retention.size=10GB"

        expose:
            - "9090"

        healthcheck:
            test:
                - CMD-SHELL
                - wget -q --spider http://localhost:9090/-/ready || exit 1
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

        networks:
            - monitoring_network

    loki-init:
        image: alpine:3.22
        user: "0:0"
        restart: "no"
        command:
            - sh
            - -c
            - |
                mkdir -p /tmp/loki/chunks /tmp/loki/rules /tmp/loki/compactor
                chown -R 10001:10001 /tmp/loki
        volumes:
            - loki_data:/tmp/loki

    loki:
        image: grafana/loki:3.7.5
        container_name: ${APP_NAME:-gurabot}-loki
        restart: unless-stopped
        logging: *default-logging

        command:
            - "-config.file=/etc/loki/loki-config.yml"

        volumes:
            - ./loki-config.yml:/etc/loki/loki-config.yml:ro
            - loki_data:/tmp/loki

        expose:
            - "3100"

        healthcheck:
            test:
                - CMD
                - /usr/bin/loki
                - -health
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

        networks:
            - monitoring_network

    grafana:
        image: grafana/grafana:13.1.2
        container_name: ${APP_NAME:-gurabot}-grafana
        restart: unless-stopped
        logging: *default-logging

        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME:-admin}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_AUTH_ANONYMOUS_ENABLED: "false"

            GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
            GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:${GRAFANA_PORT:-3000}/}
            GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}

        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
            - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
            - ./dashboards:/etc/grafana/dashboards:ro

        ports:
            - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

        depends_on:
            prometheus:
                condition: service_healthy
            loki:
                condition: service_healthy

        healthcheck:
            test:
                - CMD-SHELL
                - wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

        networks:
            - monitoring_network

networks:
    monitoring_network:
        name: gurabot_monitoring
        external: true

volumes:
    prometheus_data:
    loki_data:
    grafana_data: